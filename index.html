<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remote Administration Tool</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Remote Administration Tool</h1>
        <p>Legitimate, token-protected controls for operational service configuration.</p>
      </header>

      <section class="card">
        <h2>Public service status</h2>
        <div id="public-status" class="muted">Loading service status...</div>
      </section>

      <section class="card">
        <h2>Administrator access</h2>

        <form id="admin-auth-form" class="stack">
          <label for="admin-token">Admin token</label>
          <input id="admin-token" name="adminToken" type="password" placeholder="Set RAT_ADMIN_TOKEN on server" />
          <button type="submit">Connect admin session</button>
        </form>

        <div id="admin-panel" class="stack hidden" aria-live="polite">
          <div id="admin-status" class="muted">Not connected.</div>

          <form id="admin-config-form" class="stack">
            <label class="checkbox">
              <input id="maintenance-mode" name="maintenanceMode" type="checkbox" />
              Enable maintenance mode
            </label>

            <label for="service-message">Service message</label>
            <input id="service-message" name="serviceMessage" type="text" minlength="3" required />

            <label for="allowed-origins">Allowed origins (comma-separated)</label>
            <input id="allowed-origins" name="allowedOrigins" type="text" placeholder="127.0.0.1, localhost" required />

            <button type="submit">Save configuration</button>
          </form>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
